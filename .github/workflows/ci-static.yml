name: CoCoFlow CI

on:
  pull_request:
  push:
    branches:
      - master
      - refactor/0.4.7-P003-release-ci-gates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: CI Static / gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unity: ${{ steps.scope.outputs.unity }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Reject tracked ignored files
        run: |
          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          if [[ -n "$tracked_ignored" ]]; then
            echo "Tracked files match .gitignore:"
            echo "$tracked_ignored"
            exit 1
          fi

      - name: Test Unity result reader
        run: python3 -m unittest discover -s .github/ci -p "test_*.py" -v

      - name: Check current package identity
        run: python3 .github/ci/cocoflow_ci.py release

      - name: Classify this candidate
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          scope_args=(--base "$BASE_SHA")
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BASE_BRANCH" == "master" || "$REF_NAME" == "master" ]]; then
            scope_args+=(--force-unity)
          fi
          if [[ "$BASE_BRANCH" == "master" && "$HEAD_BRANCH" == dev/* ]]; then
            scope_args+=(--release-candidate)
            previous_version="$(git show "$BASE_SHA:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
            python3 .github/ci/cocoflow_ci.py release --previous "$previous_version"
          fi
          python3 .github/ci/cocoflow_ci.py scope "${scope_args[@]}" >> "$GITHUB_OUTPUT"

  unity:
    name: Unity / complete package
    needs: static
    if: >-
      needs.static.outputs.unity == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: unity-personal-activation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare clean host and complete dependencies
        id: prepare
        timeout-minutes: 10
        run: python3 .github/ci/prepare_unity_host.py

      - name: Install the official GameCI CLI
        env:
          GAME_CI_VERSION: v0.1.72
          GAME_CI_INSTALL: ${{ runner.temp }}/game-ci/bin
        run: |
          curl -fsSL https://raw.githubusercontent.com/game-ci/cli/main/install.sh | sh
          echo "$GAME_CI_INSTALL" >> "$GITHUB_PATH"

      - name: Activate Personal once
        id: activation
        timeout-minutes: 2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: >-
          game-ci activate .ci-work/host
          --engine=unity --engineVersion=6000.3.27f2
          --targetPlatform=StandaloneLinux64
          --unityLicensingMethod=personal --licenseRetryMaxAttempts=1

      - name: Run complete package EditMode and PlayMode
        id: tests
        timeout-minutes: 25
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          GAME_CI_UNITY_LICENSING_METHOD: personal
          GAME_CI_LICENSE_RETRY_MAX_ATTEMPTS: "1"
          # v4.4.0's false input emits an unsupported --no-coverageEnabled flag.
          GAME_CI_COVERAGE_ENABLED: "false"
          # Supported dockerEnv override: this job already activated once.
          GAME_CI_DOCKER_ENV: SKIP_ACTIVATION=true
        with:
          cliVersion: v0.1.72
          unityVersion: 6000.3.27f2
          projectPath: .ci-work/host
          packageMode: false
          testMode: all
          artifactsPath: ci-results
          githubToken: ""

      - name: Return the activated Personal seat
        if: always() && steps.activation.outcome == 'success'
        timeout-minutes: 3
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/ci/return_unity_license.sh

      - name: Record exact inputs and resolved packages
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        run: |
          mkdir -p ci-results
          cp .ci-work/prepared.json ci-results/prepared.json
          cp .ci-work/host/Packages/manifest.json ci-results/host-manifest.json
          if [[ -f .ci-work/host/Packages/packages-lock.json ]]; then
            cp .ci-work/host/Packages/packages-lock.json ci-results/packages-lock.json
          fi
          docker image inspect unityci/editor:ubuntu-6000.3.27f2-linux-il2cpp-3 \
            --format '{{json .RepoDigests}}' > ci-results/image-digests.json

      - name: Require fresh XML and all package test assemblies
        if: always() && steps.prepare.outcome == 'success'
        run: python3 .github/ci/cocoflow_ci.py unity-suite ci-results .ci-work/prepared.json

      - name: Preserve this run's test evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 30

  gate:
    name: CI / gate
    needs: [static, unity]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every applicable check
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNITY_REQUIRED: ${{ needs.static.outputs.unity }}
          UNITY_RESULT: ${{ needs.unity.result }}
        shell: bash
        run: |
          [[ "$STATIC_RESULT" == "success" ]] || exit 1
          if [[ "$UNITY_REQUIRED" == "true" ]]; then
            if [[ "$UNITY_RESULT" != "success" ]]; then
              echo "::error::This candidate requires successful complete Unity evidence; failed, cancelled, or skipped is not a pass."
              exit 1
            fi
          elif [[ "$UNITY_REQUIRED" != "false" ]]; then
            echo "::error::The required validation scope was not established."
            exit 1
          fi
