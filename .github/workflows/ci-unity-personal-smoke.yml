name: Unity Personal Activation

on:
  push:
    branches:
      - refactor/0.4.7-P003-personal-ci-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-personal-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Activate Personal with official GameCI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install GameCI using the official install script
        env:
          GAME_CI_VERSION: v0.1.72
          GAME_CI_INSTALL: ${{ runner.temp }}/game-ci/bin
        run: |
          curl -fsSL https://raw.githubusercontent.com/game-ci/cli/main/install.sh | sh
          echo "$GAME_CI_INSTALL" >> "$GITHUB_PATH"

      - name: Activate Personal license
        id: activation
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: >-
          game-ci activate .
          --engine=unity
          --engineVersion=6000.3.27f2
          --unityLicensingMethod=personal
          --licenseRetryMaxAttempts=1

      - name: Return the temporary Personal seat
        if: steps.activation.outcome == 'success'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          return_log="${RUNNER_TEMP}/unity-license-return.log"

          set +e
          game-ci return-license . \
            --engine=unity \
            --engineVersion=6000.3.27f2 \
            --unityLicensingMethod=personal \
            --licenseRetryMaxAttempts=2 \
            2>&1 | tee "$return_log"
          return_pipeline_status=("${PIPESTATUS[@]}")
          set -e

          if [[ "${return_pipeline_status[1]}" -ne 0 ]]; then
            echo "::error::Could not preserve the Unity license return log."
            exit 1
          fi

          if ! grep -Fq '[Licensing::Module] Successfully returned the entitlement license' "$return_log"; then
            echo "::error::Unity did not confirm that the Personal seat was returned."
            exit 1
          fi

          if [[ "${return_pipeline_status[0]}" -eq 0 ]]; then
            exit 0
          fi

          # Compatibility only for the pinned GameCI v0.1.72 post-return validation bug.
          if [[ "${return_pipeline_status[0]}" -eq 1 ]] &&
             [[ "$(grep -c '^\[ERROR\]' "$return_log" || true)" -eq 1 ]] &&
             grep -Fxq '[ERROR] Error: There was an error building the project. Please read the logs for details.' "$return_log" &&
             grep -Eq '^[[:space:]]+at validateBuild \(' "$return_log"; then
            echo "::notice::Unity confirmed the Personal seat was returned. Accepted the known GameCI v0.1.72 post-return build-validation error."
            exit 0
          fi

          echo "::error::Unexpected GameCI return failure (exit ${return_pipeline_status[0]})."
          exit "${return_pipeline_status[0]}"
