name: Unity Personal Activation

on:
  push:
    branches:
      - refactor/0.4.7-P003-personal-ci-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-personal-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Activate Personal with official GameCI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install GameCI using the official install script
        env:
          GAME_CI_VERSION: v0.1.72
          GAME_CI_INSTALL: ${{ runner.temp }}/game-ci/bin
        run: |
          curl -fsSL https://raw.githubusercontent.com/game-ci/cli/main/install.sh | sh
          echo "$GAME_CI_INSTALL" >> "$GITHUB_PATH"

      - name: Activate Personal license
        id: activation
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: >-
          game-ci activate .
          --engine=unity
          --engineVersion=6000.3.27f2
          --unityLicensingMethod=personal
          --licenseRetryMaxAttempts=1

      - name: Return the temporary Personal seat
        if: steps.activation.outcome == 'success'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: >-
          game-ci return-license .
          --engine=unity
          --engineVersion=6000.3.27f2
          --unityLicensingMethod=personal
          --licenseRetryMaxAttempts=2
