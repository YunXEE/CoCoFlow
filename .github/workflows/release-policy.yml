name: Release Policy

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    name: Release Metadata / gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: >-
          python .github/ci/cocoflow_ci.py release
          --head-ref "${{ github.event.pull_request.head.ref }}"
          --base-ref "${{ github.event.pull_request.base.ref }}"
          --head-repository "${{ github.event.pull_request.head.repo.full_name }}"
          --repository "${{ github.repository }}"
          --report .ci-artifacts/release/report.json

      - name: Upload release report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/release/report.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
